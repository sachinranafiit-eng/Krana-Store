[project]
name = "kirana-erp-workflows"
version = "0.1.0"
description = "Durable Temporal workflows for Kirana ERP order fulfillment"
requires-python = ">=3.11"
dependencies = [
  "temporalio>=1.8,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
