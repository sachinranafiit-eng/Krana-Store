services:
  - type: web
    name: kirana-erp
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DB_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: kirana-erp-db
          property: connectionString
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
databases:
  - name: kirana-erp-db
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 5
    postgresMajorVersion: "15"
    ipAllowList: []
